<!doctype html>
<html lang="en">
    <head>
        <title>Login - Asset Tagging System</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- <link rel="stylesheet" href="../style.css">
            here no need to add link stylesheets bootstrap installed by npm and imported in main.js so import js module into the bottom of the page. 
        -->
    </head>
    <body class="bg-body-primary">
        <div class="container min-vh-100 d-flex justify-content-center align-items-center">
            <form action="/api/auth/login" method="POST" class="card bg-body-secondary shadow-sm border-1 p-4" style="width:100%; max-width: 24rem;">
                <div class="card-body p-2">
                    <h3 class="card-title text-body-emphasis fw-bold mb-1">Welcome back!</h3>
                    <p class="text-body-secondary mb-4">Enter your credentials to access the system.</p>

                    <div class="mb-3">
                        <label for="email" class="form-label small text-body-secondary">Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-body-tertiary">@</span>
                            <input type="email" class="form-control" id="email" required placeholder="username@example.com"/>
                        </div>
                    </div>
                
                    <div class="mb-4">
                        <label for="password" class="form-label small text-body-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" required placeholder="Password"/>
                        </div>
                    </div>
                   

                    <button type="submit" class="btn btn-primary w-100 mb-3 fw-semibold">Sign In</button>
                    <div class="text-center">
                        <a href="#" class="btn btn-link text-decoration-none">Forgot Password?</a>
                    </div>
                

                </div>
            </form>
        </div>
    </body>
    <script type="module" src="./login-page.js"></script>
</html>
