# Datasource connection details are supplied by @ServiceConnection on the shared
# MySQLContainer in AbstractIntegrationTest, not by properties here. The base
# application.properties' MySQL dialect, ddl-auto=validate and Flyway settings all
# still apply -- tests run against real MySQL, so nothing needs overriding for a
# different database engine.

# The seed is applied in tests as well as under the local profile. These tests assert
# against known fixtures (the three seed users, the four assets, the pending RETURN on
# asset 3), so the data is part of the setup rather than incidental.
spring.flyway.locations=classpath:db/migration,classpath:db/seed
