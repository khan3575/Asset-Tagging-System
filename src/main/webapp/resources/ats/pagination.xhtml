<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:cc="jakarta.faces.composite"
              xmlns:h="jakarta.faces.html"
              xmlns:ui="jakarta.faces.facelets"
              xmlns:f="jakarta.faces.core">

    <cc:interface>
        <cc:attribute name="page" type="java.lang.Integer" required="true" />
        <cc:attribute name="totalPages" type="java.lang.Integer" required="true" />
        <cc:attribute name="url" type="java.lang.String" required="true" />
        <cc:attribute name="search" type="java.lang.String" required="false" />
    </cc:interface>

    <cc:implementation>
        <div class="d-flex justify-content-between">
            <h:outputLink value="#{cc.attrs.url}" styleClass="btn btn-outline-primary"
                        rendered="#{cc.attrs.page gt 1}">
                <f:param name="page" value="#{cc.attrs.page -1}"/>
                <f:param name="search" value="#{cc.attrs.search}"/>
                Previous        
            </h:outputLink>
            <span>Page : #{cc.attrs.page} of #{cc.attrs.totalPages}</span>
            <h:outputLink value="#{cc.attrs.url}" styleClass="btn btn-outline-primary"
                        rendered="#{cc.attrs.page lt cc.attrs.totalPages}">
                    
                <f:param name="page" value="#{cc.attrs.page +1 }"/>
                <f:param name="search" value="#{cc.attrs.search}" />
                Next
            </h:outputLink>
        </div>
    </cc:implementation>

</ui:component>
