<ui:component xmlns="http://www.w3.org/1999/xhtml"
              xmlns:cc="jakarta.faces.composite"
              xmlns:h="jakarta.faces.html"
              xmlns:ui="jakarta.faces.facelets"
              xmlns:f="jakarta.faces.core"
              xmlns:c="jakarta.tags.core">

    <cc:interface>
        <cc:attribute name="currentPage" type="java.lang.Integer" required="true" />
        <cc:attribute name="totalPages" type="java.lang.Integer" required="true" />
        <cc:attribute name="url" type="java.lang.String" required="true" />
        <cc:attribute name="extraParams" type="java.util.Map" required="false" />
    </cc:interface>

    <cc:implementation>
        <div class="d-flex justify-content-between">
            <h:outputLink value="#{cc.attrs.url}" styleClass="btn btn-outline-primary"
                        rendered="#{cc.attrs.currentPage gt 1}">
                <f:param name="currentPage" value="#{cc.attrs.currentPage -1}"/>
                <c:forEach items="#{cc.attrs.extraParams.entrySet()}" var="entry">
                    <f:param name="#{entry.key}" value="#{entry.value}" />
                </c:forEach>
                Previous
            </h:outputLink>
            <span>Page : #{cc.attrs.currentPage} of #{cc.attrs.totalPages}</span>
            <h:outputLink value="#{cc.attrs.url}" styleClass="btn btn-outline-primary"
                        rendered="#{cc.attrs.currentPage lt cc.attrs.totalPages}">

                <f:param name="currentPage" value="#{cc.attrs.currentPage +1 }"/>
                <c:forEach items="#{cc.attrs.extraParams.entrySet()}" var="entry">
                    <f:param name="#{entry.key}" value="#{entry.value}"/>
                </c:forEach>
                Next
            </h:outputLink>
        </div>
    </cc:implementation>

</ui:component>
