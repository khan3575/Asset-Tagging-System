
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="jakarta.faces.passthrough"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Asset View</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    </h:head>
    <h:body   styleClass="bg-body text-body">
        <div class="container">
<!--            header-->
            <ui:include src="/WEB-INF/templates/header.xhtml"/>
            <div class="row">
                <ui:include src="/WEB-INF/templates/sidebar.xhtml"/>
                <main class="col-9">
                    <div class="d-flex flex-column justify-content-between mb-3">
                        <!-- main content heading goes here -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="gap-2 p-2">
                                <h2 class="text-primary fw-bold">Asset Management</h2>
                                <p class="text-secondary text-muted">View assets here</p>
                            </div>
                            <span class="badge bg-primary bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fs-6" >
                                Total records : <strong>#{assetBean.totalCount}</strong>
                            </span>
                            <h:outputLink value="/assets/new" styleClass="btn btn-primary">Add Asset</h:outputLink>
                        </div>
                        <h:form id="update-asset-view" styleClass="row g-3" style="max-width:600;">

                            <div class="col-6">
                                <h:outputLabel for="assetTag" value="Asset Tag" styleClass="form-label mb-0" />
                                <h:inputText name="assetTag" id="assetTag" value="#{assetDetailBean.asset.assetTag}" styleClass="form-control" disabled="disabled" />
                            </div>

                            <div class="col-6">
                                <h:outputLabel for="name" value="Asset Name" styleClass="form-label mb-0" />
                                <h:inputText name="name" id="name" value="#{assetDetailBean.asset.name}" styleClass="form-control" disabled="disabled"/>
                            </div>

                            <div class="col-6">
                                <h:outputLabel for="categoryName" value="Category Name" styleClass="form-label mb-0" />
                                <h:inputText name="categoryName" id="categoryName" value="#{assetDetailBean.asset.category.name}" styleClass="form-control" disabled="disabled" />
                            </div>


                        </h:form>

                    </div>
                </main>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </h:body>
</html>
