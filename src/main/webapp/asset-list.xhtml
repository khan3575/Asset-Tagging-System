<ui:composition template="/WEB-INF/templates/main.xhtml"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:ats="jakarta.faces.composite/ats"
      xmlns:f="jakarta.faces.core">

    <ui:define name="title">Asset List</ui:define>
    <ui:define name="pageTitle">Asset Management</ui:define>
    <ui:define name="pageSubtitle">View and Search assets here</ui:define>

    <ui:define name="pageActions">
        <ats:badge text="Total records : #{assetBean.totalCount}"/>
        <h:outputLink value="/assets/new" styleClass="btn btn-primary">Add Asset</h:outputLink>
    </ui:define>
    
    <ui:define name="content">
        <div>
            <form>
                <div class="row">
                    <div class="col-auto">
                        <label for="search" class="form-label mb-0">Search</label>
                        <input type="text" name="search" id="search" value="#{assetBean.search}" class="form-control mb-2"/>
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary mt-4" type="submit">Search</button>
                    </div>
                </div>
            </form>
        </div>
        <div >
            <!-- asset table will be rendered here -->
            <h:dataTable value="#{assetBean.assetList}" var="row" styleClass="table table-striped border table-hover clickable-rows">
                <h:column>
                    <f:facet name="header">Asset Tag</f:facet>
                    <h:outputLink value="/assets/#{row.id}">
                        #{row.assetTag}
                    </h:outputLink>
                </h:column>
                <h:column>
                    <f:facet name="header">Name</f:facet>
                    #{row.name}
                </h:column>
                <h:column>
                    <f:facet name="header">Category</f:facet>
                    #{row.categoryName}
                </h:column>
                <h:column>
                    <f:facet name="header">Purchase Date</f:facet>
                    #{row.purchaseDate}
                </h:column>
                <h:column>
                    <f:facet name="header">Value</f:facet>
                    #{row.purchaseValue}
                </h:column>
                <h:column>
                    <f:facet name="header">Status</f:facet>
                    #{row.conditionStatus}
                </h:column>

            </h:dataTable>
            <ats:pagination page="#{assetBean.page}" totalPages="#{assetBean.totalPageCount}"
                url="/assets">
                <f:attribute name="extraParams" value="#{{'search':  assetBean.search}}" />
            </ats:pagination>
        </div>
    </ui:define>

</ui:composition>
