<ui:composition template="/WEB-INF/templates/main.xhtml"
        xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ats="jakarta.faces.composite/ats"
      xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewParam name="id" value="#{userDetailBean.id}" required="true"
                requiredMessage="A user id is required."/>
        <f:viewAction action="#{userDetailBean.load}"/>
    </f:metadata>

    <ui:define name="title">User Details</ui:define>
    <ui:define name="pageTitle">User Details</ui:define>
    <ui:define name="pageSubtitle">View and edit this user's information</ui:define>

    <ui:define name="pageActions">
        <ats:badge text="#{userDetailBean.user.firstName} #{userDetailBean.user.lastName}"/>
    </ui:define>

    <ui:define name="content">
        <div class="card shadow-sm">
            <div class="card-header bg-white">
                <i class="bi bi-person-badge me-2"></i>Profile
            </div>
            <h:form id="userDetailForm">
                <input type="hidden" name="#{requestScope._csrf.parameterName}" value="#{requestScope._csrf.token}" />
                <div class="card-body">
                    <div class="row g-3">
                        <div class="col-md-2">
                            <label for="id" class="form-label mb-0">Id</label>
                            <input id="id" name="id" value="#{userDetailBean.user.id}" readonly="readonly" class="form-control"/>
                        </div>

                        <div class="col-md-4">
                            <label for="firstName" class="form-label mb-0">First Name</label>
                            <h:outputText id="firstNameView" value="#{userDetailBean.user.firstName}"
                                styleClass="form-control-plaintext" rendered="#{!userDetailBean.editing}"/>
                            <h:inputText id="firstNameEdit" value="#{userDetailBean.user.firstName}"
                                styleClass="form-control" rendered="#{userDetailBean.editing}" required="true"/>
                        </div>

                        <div class="col-md-4">
                            <label for="lastName" class="form-label mb-0">Last Name</label>
                            <h:outputText id="lastNameView" value="#{userDetailBean.user.lastName}"
                                styleClass="form-control-plaintext" rendered="#{!userDetailBean.editing}"/>
                            <h:inputText id="lastNameEdit" value="#{userDetailBean.user.lastName}"
                                styleClass="form-control" rendered="#{userDetailBean.editing}" required="true"/>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label mb-0">Email</label>
                            <input id="email" name="email" value="#{userDetailBean.user.email}" readonly="readonly" class="form-control"/>
                        </div>

                        <div class="col-md-3">
                            <label for="department" class="form-label mb-0">Department</label>
                            <ats:filterSelect selectId="department" options="#{lookupBean.departmentOptionsMap}"
                                selected="#{userDetailBean.user.department.id}" disabled="true"
                                rendered="#{!userDetailBean.editing}"/>
                            <h:selectOneMenu id="departmentEdit" value="#{userDetailBean.editorDepartmentId}"
                                styleClass="form-select" rendered="#{userDetailBean.editing}" required="true">
                                <f:selectItems value="#{lookupBean.departmentList}" var="dept"
                                    itemLabel="#{dept.name}" itemValue="#{dept.id}"/>
                            </h:selectOneMenu>
                        </div>

                        <div class="col-md-3">
                            <label for="status" class="form-label mb-0">Status</label>
                            <ats:filterSelect selectId="status" options="#{{'true':'Active','false':'Inactive'}}"
                                selected="#{userDetailBean.user.enabled}" disabled="true"
                                rendered="#{!userDetailBean.editing}"/>
                            <h:selectOneMenu id="statusEdit" value="#{userDetailBean.user.enabled}"
                                styleClass="form-select" rendered="#{userDetailBean.editing}">
                                <f:selectItem itemLabel="Active" itemValue="#{true}"/>
                                <f:selectItem itemLabel="Inactive" itemValue="#{false}"/>
                            </h:selectOneMenu>
                        </div>

                        <div class="col-12">
                            <label class="form-label mb-1 d-block">Roles</label>
                            <div class="border rounded p-2 bg-light">
                                <ui:fragment rendered="#{!userDetailBean.editing}">
                                    <ui:repeat value="#{lookupBean.roleOptions}" var="role">
                                        <div class="form-check form-check-inline">
                                            <input type="checkbox" class="form-check-input" disabled="disabled"
                                                checked="#{userDetailBean.hasRole(role) ? 'checked' : null}"/>
                                            <label class="form-check-label">#{role}</label>
                                        </div>
                                    </ui:repeat>
                                </ui:fragment>
                                <ui:fragment rendered="#{userDetailBean.editing}">
                                    <div class="form-check form-check-inline">
                                        <h:selectBooleanCheckbox id="roleAdmin" value="#{userDetailBean.editorIsAdmin}" styleClass="form-check-input"/>
                                        <h:outputLabel for="roleAdmin" value="ROLE_ADMIN" styleClass="form-check-label"/>
                                    </div>
                                    <div class="form-check form-check-inline">
                                        <h:selectBooleanCheckbox id="roleEmployee" value="#{userDetailBean.editorIsEmployee}" styleClass="form-check-input"/>
                                        <h:outputLabel for="roleEmployee" value="ROLE_EMPLOYEE" styleClass="form-check-label"/>
                                    </div>
                                </ui:fragment>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-white d-flex gap-2">
                    <h:commandButton value="Edit" action="#{userDetailBean.edit}"
                        styleClass="btn btn-primary" rendered="#{!userDetailBean.editing}"/>
                    <h:commandButton value="Save" action="#{userDetailBean.save}"
                        styleClass="btn btn-success" rendered="#{userDetailBean.editing}"/>
                    <h:commandButton value="Cancel" action="#{userDetailBean.cancel}"
                        styleClass="btn btn-outline-secondary" rendered="#{userDetailBean.editing}" immediate="true"/>
                </div>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
