<ui:composition template="/WEB-INF/templates/main.xhtml"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ats="jakarta.faces.composite/ats"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewParam name="search" value="#{userListBean.search}"/>
        <f:viewParam name="currentPage" value="#{userListBean.currentPage}"/>
        <f:viewParam name="roleName" value="#{userListBean.roleName}"/>
        <f:viewParam name="departmentId" value="#{userListBean.departmentId}"/>
        <f:viewParam name="enabled" value="#{userListBean.enabled}"/>
        <f:viewAction action="#{userListBean.load}" />
    </f:metadata>

    <ui:define name="title">User List</ui:define>
    <ui:define name="pageTitle">User Management</ui:define>
    <ui:define name="pageSubtitle">View, Search and Filter here</ui:define>

    <ui:define name="pageActions">
        <ats:badge text="Total records : #{userListBean.totalRecords}"/>
        <h:link outcome="/user/form" styleClass="btn btn-primary" value="Add User"
                rendered="#{headerBean.role == 'ROLE_ADMIN'}"/>
    </ui:define>

    <ui:define name="content">
        <div>
            <h:form id="searchForm">
                <input type="hidden" name="#{requestScope._csrf.parameterName}" value="#{requestScope._csrf.token}" />
                <div class="row">
                    <div class="col-auto">
                        <h:outputLabel for="search" value="Search" styleClass="form-label mb-0"/>
                        <h:inputText id="search" value="#{userListBean.search}" styleClass="form-control mb-2"/>
                    </div>
                    <div class="col-auto">
                        <h:outputLabel for="roleName" value="Roles" styleClass="form-label mb-0"/>
                        <h:selectOneMenu id="roleName" value="#{userListBean.roleName}" styleClass="form-select">
                            <f:selectItem itemLabel="All roles" itemValue="#{null}"/>
                            <f:selectItems value="#{userListBean.roleOptions}" var="role" itemLabel="#{role}" itemValue="#{role}"/>
                        </h:selectOneMenu>
                    </div>
                    <div class="col-auto">
                        <h:outputLabel for="departmentId" value="Department id : " styleClass="form-label mb-0"/>
                        <h:inputText id="departmentId" value="#{userListBean.departmentId}" styleClass="form-control mb-2"/>
                    </div>
                    <div class="col-auto">
                        <h:outputLabel for="enabled" value="Status : " styleClass="form-label mb-0"/>
                        <h:selectOneMenu id="enabled" value="#{userListBean.enabled}" styleClass="form-select">
                            <f:selectItem itemLabel="Any" itemValue="#{null}"/>
                            <f:selectItem itemLabel="Enabled" itemValue="#{true}"/>
                            <f:selectItem itemLabel="Disabled" itemValue="#{false}"/>
                        </h:selectOneMenu>
                    </div>
                    <div class="col-auto">
                        <h:commandButton value="Search" action="#{userListBean.search}" styleClass="btn btn-primary mt-4"/>
                    </div>
                </div>
            </h:form>

        </div>
        <div >
            <!-- user tables will be rendered here -->
            <h:dataTable value="#{userListBean.users}" var="user" styleClass="table table-striped border table-hover clickable-rows">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    <h:link outcome="/user/detail" styleClass="text-decoration-none text-body d-block">
                        <f:param name="id" value="#{user.id}"/>
                        #{user.id}
                    </h:link>
                </h:column>
                <h:column>
                    <f:facet name="header">Full name</f:facet>
                    #{user.firstName} #{user.lastName}
                </h:column>
                <h:column>
                    <f:facet name="header">Email</f:facet>
                    #{user.email}
                </h:column>
                <h:column>
                    <f:facet name="header">Department</f:facet>
                    #{user.department.name}
                </h:column>
                <h:column>
                    <f:facet name="header">Roles</f:facet>
                    <ui:repeat value="#{user.roles}" var="roles">
                        #{roles.name}
                    </ui:repeat>
                </h:column>
                <h:column>
                    <f:facet name="header">Active Employee</f:facet>
                    #{user.enabled}
                </h:column>
            </h:dataTable>
            <ats:pagination currentPage="#{userListBean.currentPage}" totalPages="#{userListBean.totalPages}"
                url="/user/list" extraParams="#{userListBean.extraParams}" />

        </div>
    </ui:define>
</ui:composition>
