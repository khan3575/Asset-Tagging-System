<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="jakarta.faces.passthrough"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">

    <h:head>
        <title>Add Asset</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    </h:head>
    <h:body   styleClass="bg-body text-body">
        <div class="container">
<!--            header-->
            <ui:include src="/WEB-INF/templates/header.xhtml"/>
            <div class="row">
                <ui:include src="/WEB-INF/templates/sidebar.xhtml"/>
                <main class="col-9">
                    <div class="d-flex flex-column justify-content-between mb-3">
                        <!-- main content heading goes here -->
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="gap-2 p-2">
                                <h2 class="text-primary fw-bold">Asset Management</h2>
                                <p class="text-secondary text-muted">Add asset here</p>
                            </div>
                        </div>

                        <h:messages globalOnly="true" styleClass="alert alert-danger" layout="table"/>

                        <h:form id="add-asset-form" styleClass="row g-3" style="max-width: 600px;">
                            <div class="col-12">
                                <h:outputLabel for="assetTag" value="Asset Tag" styleClass="form-label mb-0"/>
                                <h:inputText id="assetTag" value="#{assetFormBean.assetTag}" styleClass="form-control" required="true"/>
                            </div>
                            <div class="col-12">
                                <h:outputLabel for="name" value="Name" styleClass="form-label mb-0"/>
                                <h:inputText id="name" value="#{assetFormBean.name}" styleClass="form-control" required="true"/>
                            </div>
                            <div class="col-12">
                                <h:outputLabel for="categoryId" value="Category" styleClass="form-label mb-0"/>
                                <h:selectOneMenu id="categoryId" value="#{assetFormBean.categoryId}" styleClass="form-select" required="true">
                                    <f:selectItem itemLabel="-- Select category --" itemValue="#{null}"/>
                                    <f:selectItems value="#{lookupBean.assetCategoryList}" var="category"
                                                   itemLabel="#{category.name}" itemValue="#{category.id}"/>
                                </h:selectOneMenu>
                            </div>
                            <div class="col-12">
                                <h:outputLabel for="purchaseDate" value="Purchase Date" styleClass="form-label mb-0"/>
                                <h:inputText id="purchaseDate" value="#{assetFormBean.purchaseDate}" styleClass="form-control"
                                            p:type="date" required="true">
                                    <f:convertDateTime type="localDate" pattern="yyyy-MM-dd"/>
                                </h:inputText>

                            </div>
                            <div class="col-12">
                                <h:outputLabel for="value" value="Value" styleClass="form-label mb-0"/>
                                <h:inputText id="value" value="#{assetFormBean.value}" styleClass="form-control" required="true"/>
                            </div>
                            <div class="col-12">
                                <h:commandButton value="Save" action="#{assetFormBean.save}" styleClass="btn btn-primary"/>
                                <h:outputLink value="/assets" styleClass="btn btn-outline-secondary">Cancel</h:outputLink>
                            </div>
                        </h:form>
                    </div>
                </main>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </h:body>
</html>
