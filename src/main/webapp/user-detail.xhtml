<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
        xmlns:h="jakarta.faces.html"
      xmlns:p="jakarta.faces.passthrough"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <title>User Details</title>
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, intial-scale=1.0"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

    </h:head>
    <h:body styleClass="bg-body text-body py-4">
        <div class="container">
            <div class="row mb-3">
                <ui:include src="/WEB-INF/templates/header.xhtml"/>
            </div>
            <div class="row g-3">
                <ui:include src="/WEB-INF/templates/sidebar.xhtml"/>
                <main class="col-9">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div>
                            <h2 class="text-primary fw-bold">User Details</h2>
                            <p class="text-secondary text-muted">View and edit this user's information</p>
                        </div>
                        <span class="badge bg-primary bg-primary-subtle text-primary border border-primary-subtle px-3 py-2 rounded-pill fs-6">
                            #{userDetailBean.user.firstName} #{userDetailBean.user.lastName}
                        </span>
                    </div>

                    <div class="card shadow-sm">
                        <div class="card-header bg-white">
                            <i class="bi bi-person-badge me-2"></i>Profile
                        </div>
                        <form method="POST" action="/user/#{userDetailBean.user.id}" onsubmit="return confirmSave();">
                            <div class="card-body">
                                <div class="row g-3">
                                    <div class="col-md-2">
                                        <label for="id" class="form-label mb-0">Id</label>
                                        <input id="id" name="id" value="#{userDetailBean.user.id}" readonly="readonly" class="form-control"/>
                                    </div>

                                    <div class="col-md-4">
                                        <label for="firstName" class="form-label mb-0">First Name</label>
                                        <input id="firstName" name="firstName" value="#{userDetailBean.user.firstName}" readonly="readonly" class="form-control"/>
                                    </div>

                                    <div class="col-md-4">
                                        <label for="lastName" class="form-label mb-0">Last Name</label>
                                        <input id="lastName" name="lastName" value="#{userDetailBean.user.lastName}" readonly="readonly" class="form-control"/>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="email" class="form-label mb-0">Email</label>
                                        <input id="email" name="email" value="#{userDetailBean.user.email}" readonly="readonly" class="form-control"/>
                                    </div>

                                    <div class="col-md-3">
                                        <label for="department" class="form-label mb-0">Department</label>
                                        <select id="department" name="department" disabled="disabled" class="form-select">
                                            <ui:repeat value="#{lookupBean.departmentList}" var="dept">
                                                <ui:fragment rendered="#{dept == userDetailBean.user.department}">
                                                    <option value="#{dept.id}" selected="selected">#{dept.name}</option>
                                                </ui:fragment>
                                                <ui:fragment rendered="#{dept != userDetailBean.user.department}">
                                                    <option value="#{dept.id}">#{dept.name}</option>
                                                </ui:fragment>
                                            </ui:repeat>
                                        </select>
                                    </div>

                                    <div class="col-md-3">
                                        <label for="status" class="form-label mb-0">Status</label>
                                        <select id="status" name="status" disabled="disabled" class="form-select">
                                            <ui:fragment rendered="#{userDetailBean.user.enabled}">
                                                <option value="true" selected="selected">Active</option>
                                                <option value="false">Inactive</option>
                                            </ui:fragment>
                                            <ui:fragment rendered="#{!userDetailBean.user.enabled}">
                                                <option value="true">Active</option>
                                                <option value="false" selected="selected">Inactive</option>
                                            </ui:fragment>
                                        </select>
                                    </div>

                                    <div class="col-12">
                                        <label class="form-label mb-1 d-block">Roles</label>
                                        <div class="border rounded p-2 bg-light">
                                            <ui:repeat value="#{lookupBean.roleOptions}" var="role">
                                                <ui:fragment rendered="#{userDetailBean.hasRole(role)}">
                                                    <div class="form-check form-check-inline">
                                                        <input type="checkbox" class="form-check-input role-checkbox" id="role_#{role}" name="roles" value="#{role}" disabled="disabled" checked="checked"/>
                                                        <label class="form-check-label" for="role_#{role}">#{role}</label>
                                                    </div>
                                                </ui:fragment>
                                                <ui:fragment rendered="#{!userDetailBean.hasRole(role)}">
                                                    <div class="form-check form-check-inline">
                                                        <input type="checkbox" class="form-check-input role-checkbox" id="role_#{role}" name="roles" value="#{role}" disabled="disabled"/>
                                                        <label class="form-check-label" for="role_#{role}">#{role}</label>
                                                    </div>
                                                </ui:fragment>
                                            </ui:repeat>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="card-footer bg-white d-flex gap-2">
                                <button type="button" id="editBtn" class="btn btn-primary" onclick="enableEdit()">
                                    <i class="bi bi-pencil-square me-1"></i>Edit
                                </button>
                                <button type="submit" id="saveBtn" class="btn btn-success" style="display:none;">
                                    <i class="bi bi-check-lg me-1"></i>Save
                                </button>
                                <button type="button" id="cancelBtn" class="btn btn-outline-secondary" style="display:none;" onclick="cancelEdit()">
                                    <i class="bi bi-x-lg me-1"></i>Cancel
                                </button>
                            </div>
                        </form>
                    </div>
                </main>
            </div>
        </div>
        <h:outputScript name="user-detail.js" library="js" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        
    </h:body>
</html>
