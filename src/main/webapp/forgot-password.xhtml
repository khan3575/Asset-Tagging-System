<ui:composition template="/WEB-INF/templates/base.xhtml"
                    xmlns="http://www.w3.org/1999/xhtml"
                    xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Forgot Password - ATS</ui:define>

    <ui:define name="body">
        <div class="container d-flex align-items-center justify-content-center min-vh-100 p-10">
            <div class="card p-4 mb-3 text-center" style="width:24rem;">
                <i class="bi bi-key text-secondary" style="font-size:2rem;"></i>
                <h5 class="mt-3">Forgot your password?</h5>
                <p class="text-muted">
                    Self-service password reset isn't available yet. Please contact your
                    administrator to have your password reset.
                </p>
                <a href="/login" class="btn btn-primary mt-2">Back to Login</a>
            </div>
        </div>
    </ui:define>
</ui:composition>
