<ui:composition   template="/WEB-INF/templates/main.xhtml"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core" 
    xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Audit Log</ui:define>
    <ui:define name="pageTitle">Audit Log</ui:define>
    <ui:define name="content">
        <h:dataTable value="#{auditLogBean.entries}" var="entry" styleClass="table table-striped">
            <h:column>
                <f:facet name="header">When</f:facet>
                #{entry.createdAt}
            </h:column>
            <h:column>
                <f:facet name="header">Actor User Id</f:facet>
                #{entry.actorUserId}
            </h:column>
            <h:column>
                <f:facet name="header">Action</f:facet>
                #{entry.action}
            </h:column>
            <h:column>
                <f:facet name="header">Entity</f:facet>
                #{entry.entityType} ##{entry.entityId}
            </h:column>
            <h:column>
                <f:facet name="header">Description</f:facet>
                #{entry.description}
            </h:column>
            <h:column>
                <f:facet name="header">Ip Address</f:facet>
                #{entry.ipAddress}
            </h:column>
        </h:dataTable>
        <div class="d-flex justify-content-between">
            <ui:fragment rendered="#{auditLogBean.page gt 1}">
                <h:outputLink value="/audit-log" styleClass="btn btn-outline-primary">
                    <f:param name="page" value="#{auditLogBean.page - 1}"/>
                    Previous
                </h:outputLink>
            </ui:fragment>
    
            <ui:fragment rendered="#{auditLogBean.page lt auditLogBean.totalPageCount}">
                <h:outputLink value="/audit-log" styleClass="btn btn-outline-primary">
                    <f:param name="page" value="#{auditLogBean.page + 1}"/>
                    Next
                </h:outputLink>
            </ui:fragment>
            <span>Page : #{auditLogBean.page} of #{auditLogBean.totalPageCount}</span>
        </div>
    </ui:define>
            
</ui:composition>
