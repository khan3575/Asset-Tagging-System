<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core" xmlns:ui="jakarta.faces.facelets">
    <h:head>
        <title>Audit Log</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />

    </h:head>
    <h:body class="bg-body-secondary py-4">
<!--        main container -->
        <div class="container">
            <header class="row mb-3">
<!--            header row -->
                <ui:include src="/WEB-INF/templates/header.xhtml"/>
            </header>

            <div class="row g-3">
<!--                side bar  -->
                <ui:include src="/WEB-INF/templates/sidebar.xhtml" />
<!--                main content part-->
                <main class="col-md-9">
                    <h2>Audit Log</h2>
                    <h:dataTable value="#{auditLogBean.entries}" var="entry" styleClass="table table-striped">
                        <h:column>
                            <f:facet name="header">When</f:facet>
                            #{entry.createdAt}
                        </h:column>
                        <h:column>
                            <f:facet name="header">Actor User Id</f:facet>
                            #{entry.actorUserId}
                        </h:column>
                        <h:column>
                            <f:facet name="header">Action</f:facet>
                            #{entry.action}
                        </h:column>
                        <h:column>
                            <f:facet name="header">Entity</f:facet>
                            #{entry.entityType} ##{entry.entityId}
                        </h:column>
                        <h:column>
                            <f:facet name="header">Description</f:facet>
                            #{entry.description}
                        </h:column>
                        <h:column>
                            <f:facet name="header">Ip Address</f:facet>
                            #{entry.ipAddress}
                        </h:column>
                    </h:dataTable>
                </main>

            </div>
        </div>


        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </h:body>
</html>
