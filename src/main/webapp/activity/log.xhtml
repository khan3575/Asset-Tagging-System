<ui:composition   template="/WEB-INF/templates/main.xhtml"
    xmlns:ats="jakarta.faces.composite/ats"
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="jakarta.faces.html"
    xmlns:f="jakarta.faces.core" 
    xmlns:ui="jakarta.faces.facelets">

    <f:metadata>
        <f:viewParam name="currentPage" value="#{activityLogBean.currentPage}"/>
        <f:viewAction action="#{activityLogBean.load}"/>
    </f:metadata>


    <ui:define name="title">Activity Log</ui:define>
    <ui:define name="pageTitle">Activity Log</ui:define>
    <ui:define name="content">
        <h:dataTable value="#{activityLogBean.entries}" var="entry" styleClass="table table-striped">
            <h:column>
                <f:facet name="header">When</f:facet>
                <h:outputText value="#{entry.occurredAt}">
                    <f:convertDateTime type="localDateTime" pattern="dd MMM yyyy, HH:mm" />
                </h:outputText>
            </h:column>
            <h:column>
                <f:facet name="header">Actor User Id</f:facet>
                #{entry.actorUserId}
            </h:column>
            <h:column>
                <f:facet name="header">Action</f:facet>
                #{entry.action}
            </h:column>
            <h:column>
                <f:facet name="header">Entity</f:facet>
                #{entry.entityType} ##{activityLogBean.entityIdOf(entry)}
            </h:column>
            <h:column>
                <f:facet name="header">Description</f:facet>
                #{entry.summary}
            </h:column>
            <h:column>
                <f:facet name="header">Outcome</f:facet>
                <h:outputText value="#{entry.outcome}" styleClass="badge #{entry.outcome eq 'SUCCEEDED' ? 'text-bg-success': (entry.outcome eq 'DENIED'? 'text-bg-warning' : 'text-bg-danger')}" />
            </h:column>
        </h:dataTable>
        <ats:pagination currentPage="#{activityLogBean.currentPage}" totalPages="#{activityLogBean.totalPages}" url="/activity/log" />
    </ui:define>
            
</ui:composition>
