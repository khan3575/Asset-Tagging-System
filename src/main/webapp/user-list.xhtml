<ui:composition template="/WEB-INF/templates/main.xhtml"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ats="jakarta.faces.composite/ats"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewParam name="search" value="#{userListBean.search}"/>
        <f:viewParam name="page" value="#{userListBean.page}"/>
        <f:viewParam name="roleName" value="#{userListBean.roleName}"/>
        <f:viewParam name="departmentId" value="#{userListBean.departmentId}"/>
        <f:viewParam name="enabled" value="#{userListBean.enabled}"/>
        <f:viewAction action="#{userListBean.load}" />
    </f:metadata>

    <ui:define name="title">User List</ui:define>
    <ui:define name="pageTitle">User Management</ui:define>
    <ui:define name="pageSubtitle">View, Search and Filter here</ui:define>

    <ui:define name="pageActions">
        <ats:badge text="Total records : #{userListBean.totalCount}"/>
    </ui:define>

    <ui:define name="content">
        <div>
            <form>
                <div class="row">
                    <div class="col-auto">
                        <label for="search" class="form-label mb-0">Search</label>
                        <input type="text" name="search" id="search" value="#{userListBean.search}" class="form-control mb-2"/>
                    </div>
                    <div class="col-auto">
                        <label for="roleName" class="form-label mb-0" >Roles</label>
                        <ats:filterSelect selectId="roleName" options="#{userListBean.roleOptionsMap}"
                            selected="#{userListBean.roleName}" emptyLabel="All roles"/>
                    </div>
                    <div class="col-auto">
                        <label for="departmentId" class="form-label mb-0">Department id : </label>
                        <input type="text" name="departmentId" id="departmentId" value="#{userListBean.departmentId}" class="form-control mb-2"/>
                    </div>
                    <div class="col-auto">
                        <label for="enabled" class="form-label mb-0">Status : </label>
                        <ats:filterSelect selectId="enabled" options="#{{'true':'Enabled','false':'Disabled'}}"
                            selected="#{userListBean.enabled}" emptyLabel="Any"/>
                    </div>
                    <div class="col-auto">
                        <button class="btn btn-primary mt-4" type="submit">Search</button>
                    </div>
                </div>
            </form>
        </div>
        <div >
            <!-- user tables will be rendered here -->
            <h:dataTable value="#{userListBean.users}" var="user" styleClass="table table-striped border table-hover clickable-rows">
                <h:column>
                    <f:facet name="header">ID</f:facet>
                    <a href="#{request.contextPath}/user/#{user.id}" class="text-decoration-none text-body d-block">
                        #{user.id}
                    </a>
                </h:column>
                <h:column>
                    <f:facet name="header">Full name</f:facet>
                    #{user.firstName} #{user.lastName}
                </h:column>
                <h:column>
                    <f:facet name="header">Email</f:facet>
                    #{user.email}
                </h:column>
                <h:column>
                    <f:facet name="header">Department</f:facet>
                    #{user.department.name}
                </h:column>
                <h:column>
                    <f:facet name="header">Roles</f:facet>
                    <ui:repeat value="#{user.roles}" var="roles">
                        #{roles.name}
                    </ui:repeat>
                </h:column>
                <h:column>
                    <f:facet name="header">Active Employee</f:facet>
                    #{user.enabled}
                </h:column>
            </h:dataTable>
            <ats:pagination page="#{userListBean.page}" totalPages="#{userListBean.totalPageCount}"
                url="/user" extraParams="#{userListBean.extraParams}" />

        </div>
    </ui:define>
</ui:composition>
