<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
    <head>
        <title>Login to ATS</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    </head>
    <body class="bg bg-body">
        <div class="container d-flex align-items-center justify-content-center min-vh-100 p-10">
            <form class="card p-4 mb-3" style="width:24rem;"  action="/login" method="post" >
                <label for="username" class="form-label">Email Address</label>
                <input class="form-control mb-3" type="text" placeholder="name@example.com"  id="username" name="username"></input>

                <label for="password" class="form-label">Password</label>
                <input class="form-control mb-3" type="password" placeholder="Password" name="password" id="password"></input>

                <a href="/forgot-password" class="text-reset text-decoration-none mb-2">Forgot Password?</a>
                <button class="btn btn-primary" type="submit">Submit</button>
            </form>
            
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
