<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets">
    <header class="header col-12 d-flex justify-content-between align-items-center p-3 mb-3">
        <a class="nav-brand fw-bold text-primary text-decoration-none " href="#{request.contextPath}/dashboard">Asset Tagging System</a>
        <div class="d-flex align-items-center gap-3">
            <span> Logged in as : <strong> #{headerBean.role}</strong> </span>

            </a>
        </div>
    </header>
</ui:composition>
