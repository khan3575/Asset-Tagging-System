<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html">
    <aside class="col-md-3">
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                
                <h:link styleClass="nav-link" outcome="/dashboard" value="Dashboard" />
            </li>
            <li class="nav-item">
                <h:link styleClass="nav-link" outcome="/asset/list" value="Assets" />
            </li>
            <li class="nav-item">
                <h:link styleClass="nav-link" outcome="/activity/log" value="Activity Log" />
            </li>
            <li class="nav-item">
                <h:link styleClass="nav-link" outcome="/user/list" value="Users" />
            </li>
            <li class="nav-item" rendered="#{headerBean.role == 'ROLE_ADMIN'}">
                <h:link styleClass="nav-link" outcome="/approval/list" value="Approvals" />
            </li>
            <li class="nav-item">
                <h:link styleClass="nav-link" outcome="/settings" value="Settings" />
            </li>
            <li class="nav-item">
                <form action="#{request.contextPath}/logout" method="POST">
                    <input type="hidden" name="#{requestScope._csrf.parameterName}" value="#{requestScope._csrf.token}" />
                    <button type="submit" class="nav-link btn btn-link text-start w-100 border-0 p-2">
                        <i class="bi bi-box-arrow-right"></i> Logout
                    </button>
                </form>
            </li>
        </ul>

    </aside>
</ui:composition>
