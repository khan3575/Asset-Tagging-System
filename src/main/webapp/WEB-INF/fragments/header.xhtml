<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets">

    <header class="d-flex justify-content-between p-3 mb-3">
        <h:link outcome="/dashboard"
                styleClass="nav-brand h2 fw-bold text-primary text-decoration-none pt-3"
                value="Asset Tagging System"/>

        <div class="d-flex align-items-center gap-3">
            <span>Logged in as : <strong>#{headerBean.role}</strong></span>

            <h:link outcome="/settings" styleClass="btn btn-outline-secondary gap-1">
                <i class="bi bi-person"></i>
                #{headerBean.firstName}
            </h:link>
        </div>
    </header>
</ui:composition>
