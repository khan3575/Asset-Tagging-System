<ui:composition template="/WEB-INF/templates/main.xhtml"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:ats="jakarta.faces.composite/ats"
      xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewParam name="search" value="#{assetBean.search}"/>
        <f:viewParam name="currentPage" value="#{assetBean.currentPage}"/>
        <f:viewAction action="#{assetBean.load}" />
    </f:metadata>
    
    <ui:define name="title">Asset List</ui:define>
    <ui:define name="pageTitle">Asset Management</ui:define>
    <ui:define name="pageSubtitle">View and Search assets here</ui:define>

    <ui:define name="pageActions">
        <ats:badge text="Total records : #{assetBean.totalRecords}"/>
        <h:link outcome="/asset/form" styleClass="btn btn-primary" value="Add Asset"/>
    </ui:define>
    
    <ui:define name="content">
        <div>
            <h:form id="searchForm">
                <input type="hidden" name="#{requestScope._csrf.parameterName}" value="#{requestScope._csrf.token}" />
                <div class="row">
                    <div class="col-10">
                        <h:outputLabel for="search" value="Search" styleClass="form-label mb-0 text-muted"/>
                        <h:inputText id="search" value="#{assetBean.search}" styleClass="form-control mb-2"/>
                    </div>
                    <div class="col-2">
                        <h:commandButton value="Search" action="#{assetBean.search}" styleClass="btn btn-primary mt-4"/>
                    </div>
                </div>
            </h:form>
        </div>
        <div >
            <!-- asset table will be rendered here -->
            <h:dataTable value="#{assetBean.assetList}" var="row" styleClass="table table-striped border table-hover clickable-rows">
                <h:column>
                    <f:facet name="header">Asset Tag</f:facet>
                    <h:link outcome="/asset/detail">
                        <f:param name="id" value="#{row.id}"/>
                        #{row.assetTag}
                    </h:link>
                </h:column>
                <h:column>
                    <f:facet name="header">Name</f:facet>
                    #{row.name}
                </h:column>
                <h:column>
                    <f:facet name="header">Category</f:facet>
                    #{row.categoryName}
                </h:column>
                <h:column>
                    <f:facet name="header">Purchase Date</f:facet>
                    #{row.purchaseDate}
                </h:column>
                <h:column>
                    <f:facet name="header">Value</f:facet>
                    #{row.purchaseValue}
                </h:column>
                <h:column>
                    <f:facet name="header">Status</f:facet>
                    #{row.conditionStatus}
                </h:column>

            </h:dataTable>
            <ats:pagination currentPage="#{assetBean.currentPage}" totalPages="#{assetBean.totalPages}"
                url="/asset/list">
                <f:attribute name="extraParams" value="#{{'search':  assetBean.search}}" />
            </ats:pagination>
        </div>
    </ui:define>

</ui:composition>
