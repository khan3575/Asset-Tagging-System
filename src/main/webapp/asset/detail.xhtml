<ui:composition template="/WEB-INF/templates/main.xhtml"
      xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ats="jakarta.faces.composite/ats"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:f="jakarta.faces.core">


    <f:metadata>
        <f:viewParam name="id" value="#{assetDetailBean.id}" required="true"
                requiredMessage="An asset id is required." />
        <f:viewAction action="#{assetDetailBean.load}"/>
    </f:metadata>

    <ui:define name="title">Asset View</ui:define>
    <ui:define name="pageTitle">Asset Management</ui:define>
    <ui:define name="pageSubtitle">View assets here</ui:define>

    <ui:define name="pageActions">
        <ats:badge text="Total records : #{assetBean.totalRecords}"/>
        <h:link outcome="/asset/form" styleClass="btn btn-primary" value="Add Asset"/>
    </ui:define>

    <ui:define name="content">
        <h:form id="update-asset-view" styleClass="row g-3" style="max-width:600;">
            <input type="hidden" name="#{requestScope._csrf.parameterName}" value="#{requestScope._csrf.token}" />
            <div class="col-6">
                <h:outputLabel for="assetTag" value="Asset Tag" styleClass="form-label mb-0" />
                <h:inputText name="assetTag" id="assetTag" value="#{assetDetailBean.asset.assetTag}" styleClass="form-control" disabled="disabled" />
            </div>

            <div class="col-6">
                <h:outputLabel for="name" value="Asset Name" styleClass="form-label mb-0" />
                <h:inputText name="name" id="name" value="#{assetDetailBean.asset.name}" styleClass="form-control" disabled="disabled"/>
            </div>

            <div class="col-6">
                <h:outputLabel for="categoryName" value="Category Name" styleClass="form-label mb-0" />
                <h:inputText name="categoryName" id="categoryName" value="#{assetDetailBean.asset.category.name}" styleClass="form-control" disabled="disabled" />
            </div>
        </h:form>

        <div class="card shadow-sm mt-3">
            <div class="card-header bg-white">
                <i class="bi bi-person-check me-2"></i>Custody
            </div>
            <div class="card-body">
                <ui:fragment rendered="#{headerBean.role == 'ROLE_ADMIN'}">
                    <p class="mb-2">
                        <strong>Current Holder:</strong>
                        <ui:fragment rendered="#{assetDetailBean.currentHolder != null}">
                            #{assetDetailBean.currentHolder.firstName} #{assetDetailBean.currentHolder.lastName}
                        </ui:fragment>
                        <ui:fragment rendered="#{assetDetailBean.currentHolder == null}">
                            Unassigned
                        </ui:fragment>
                    </p>
                </ui:fragment>

                <ui:fragment rendered="#{headerBean.role != 'ROLE_ADMIN'}">
                    <p class="mb-2">
                        <strong>Status:</strong>
                        <ui:fragment rendered="#{assetDetailBean.heldByCurrentUser}">
                            Held by you
                        </ui:fragment>
                        <ui:fragment rendered="#{!assetDetailBean.heldByCurrentUser and assetDetailBean.currentHolder != null}">
                            Currently assigned
                        </ui:fragment>
                        <ui:fragment rendered="#{assetDetailBean.currentHolder == null}">
                            Available
                        </ui:fragment>
                    </p>
                </ui:fragment>

                <ats:badge text="Request Pending" rendered="#{assetDetailBean.transferPending}"/>

                <h:form id="request-form" styleClass="mt-2"
                        rendered="#{headerBean.role != 'ROLE_ADMIN' and !assetDetailBean.transferPending and !assetDetailBean.heldByCurrentUser}">
                    <input type="hidden" name="#{requestScope._csrf.parameterName}" value="#{requestScope._csrf.token}" />
                    <h:commandButton value="Request This Asset" action="#{assetDetailBean.requestForSelf}" styleClass="btn btn-primary"
                        onclick="if(!confirm('Request this asset for yourself?')) { return false; }"/>
                </h:form>
                <h:form id="return-form" styleClass="mt-2"
                        rendered="#{assetDetailBean.heldByCurrentUser and !assetDetailBean.transferPending}">
                    <input type="hidden" name="#{requestScope._csrf.parameterName}" value="#{requestScope._csrf.token}" />
                    <h:commandButton value="Return This Asset" action="#{assetDetailBean.requestReturn}" styleClass="btn btn-outline-secondary"
                        onclick="if(!confirm('Return this asset?')) { return false; }"/>
                </h:form>

                <h:form id="transfer-form" styleClass="row g-3 mt-2"
                        rendered="#{headerBean.role == 'ROLE_ADMIN' and !assetDetailBean.transferPending}">
                    <input type="hidden" name="#{requestScope._csrf.parameterName}" value="#{requestScope._csrf.token}" />
                    <div class="col-6">
                        <h:outputLabel for="selectedHolder" value="Transfer To" styleClass="form-label mb-0" />
                        <h:selectOneMenu id="selectedHolder" value="#{assetDetailBean.selectedHolderId}" styleClass="form-select" required="true">
                            <f:selectItem itemLabel="-- select employee --" itemValue="#{null}" noSelectionOption="true"/>
                            <f:selectItems value="#{assetDetailBean.availableHolders}" var="holder"
                                itemLabel="#{holder.firstName} #{holder.lastName}" itemValue="#{holder.id}"/>
                        </h:selectOneMenu>
                    </div>
                    <div class="col-12">
                        <h:commandButton value="Initiate Transfer" action="#{assetDetailBean.transfer}" styleClass="btn btn-primary" 
                            onclick="if(!confirm('Are you sure you want to transfer this asset?')) {this.form.reset(); return false; }"/>
                    </div>
                </h:form>

                <h:form id="condition-form" styleClass="row g-3 mt-2" rendered="#{headerBean.role == 'ROLE_ADMIN'}">
                    <input type="hidden" name="#{requestScope._csrf.parameterName}" value="#{requestScope._csrf.token}"/>

                    <div class="col-6">
                        <h:outputLabel for="condition-form-drop-down" value="Asset Condition" styleClass="form-label mb-0" />
                        <h:selectOneMenu id="condition-form-drop-down" value="#{assetDetailBean.conditionStatus}" styleClass="form-select" required="true">
                            <f:selectItems value="#{assetDetailBean.conditionStatusList}" var="status" itemLabel="#{status}" itemValue="#{status}" />
                        </h:selectOneMenu>
                    </div>
                    <div class="col-12">
                        <h:commandButton value="Update Condition" action="#{assetDetailBean.changeCondition}" styleClass="btn btn-primary"
                         
                        onclick="if(!confirm('Are you sure you want to update the Asset Condition?')){this.form.reset(); return false;}" />
                    </div>
                </h:form>
            </div>
        </div>
    </ui:define>
</ui:composition>
