<ui:composition template="/WEB-INF/templates/base.xhtml"
                    xmlns="http://www.w3.org/1999/xhtml"
                    xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Something went wrong - ATS</ui:define>

    <ui:define name="body">
        <div class="auth-background d-flex align-items-center justify-content-center min-vh-100">
            <div class="card glass-card p-4 mb-3 text-center" style="width:24rem;">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size:2rem;"></i>
                <h5 class="mt-3">Something went wrong</h5>
                <p class="text-muted">
                    An unexpected error occurred while processing your request. It has been
                    logged. Please try again, and contact your administrator if it keeps happening.
                </p>
                <a href="/dashboard" class="btn btn-primary mt-2">Back to Dashboard</a>
            </div>
        </div>
    </ui:define>
</ui:composition>
