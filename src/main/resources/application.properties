spring.application.name=asset-tagging-system

spring.main.banner-mode=off
# General JPA Settings (Safe for everyone to see)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway migrates the schema before Hibernate validates it above, so the two
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true


#spring db connection
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?useSSL=false&connectionTimeZone=SERVER&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

joinfaces.faces.project-stage=Development
joinfaces.faces.automatic-extensionless-mapping=true
joinfaces.faces.disable-facesservlet-to-xhtml=true

logging.file.name=logs/app.log

# Document uploads (asset photograph and purchase invoice).
# max-request-size covers a photograph (5MB) and invoice (10MB) uploaded together,
# as the add-asset form now submits both in a single multipart request.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=16MB
