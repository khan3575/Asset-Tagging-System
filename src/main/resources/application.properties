spring.application.name=asset-tagging-system

spring.main.banner-mode=off
# General JPA Settings (Safe for everyone to see)
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway migrates the schema before Hibernate validates it above, so the two
# stay complementary: Flyway builds the schema, ddl-auto=validate confirms the
# entities still agree with it. clean-disabled is a safety net against ever
# running `flyway:clean` (drops every Flyway-managed object) outside a
# throwaway environment -- override to false only in a local profile if you
# deliberately want that command available.
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true


#spring db connection
spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

joinfaces.faces.project-stage=Development
# joinfaces.omnifaces.faces-views-scan-paths=/*.xhtml
# joinfaces.omnifaces.faces-views-extension-action=REDIRECT_TO_EXTENSIONLESS

logging.file.name=logs/app.log
